<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美和科技大學　華語文閱讀與寫作 II　期末考（線上）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--accent:#0f3460;--accent2:#e94560;--paper:#fff;--bg:#eef2f8;--ink:#1a1a2e;--ink2:#555;--line:#d8dee9;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin:13px 0;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.hd{background:var(--accent);color:#fff;border-radius:14px;padding:20px;margin-bottom:8px}
.hd h1{margin:0;font-size:20px}.hd .sub{opacity:.9;font-size:13px;margin-top:4px}
.sec-h{font-size:17px;font-weight:900;color:var(--accent);margin:18px 4px 6px;border-bottom:2px solid var(--accent);padding-bottom:5px}
.passage{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;margin:8px 0 4px}
.ptitle{font-weight:700;color:var(--accent);font-size:15px;margin:6px 0 2px}
.q{font-weight:700;margin:14px 0 8px}.q .n{color:var(--accent2);margin-right:4px}
.opt{display:block;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;margin:6px 0;cursor:pointer;transition:.12s;font-size:15px}
.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);background:#eaf0f8;font-weight:700}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:15px;resize:vertical}
input{font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;width:100%;margin:6px 0}
button{font-family:inherit;font-weight:900;font-size:16px;color:#fff;background:var(--accent2);border:none;border-radius:12px;padding:13px 22px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px;text-align:center;border-radius:0 0 14px 14px;margin-top:10px}
#timer{position:sticky;top:0;z-index:30;background:var(--accent);color:#fff;text-align:center;font-weight:900;font-size:17px;padding:9px;border-radius:0 0 12px 12px;letter-spacing:.05em}
#timer.warn{background:var(--accent2)}
.hint{font-size:13px;color:var(--ink2)}
.hide{display:none}
.done{text-align:center;padding:40px 20px}.done h2{color:var(--ok);font-size:26px;margin:0 0 8px}
.essaybox label{display:block;margin:8px 0;font-weight:700;cursor:pointer}
</style></head><body>

<div class="wrap">

  <input id="gsid" placeholder="學號" autocomplete="off">

</div>
</div>
<script>
var DATA={"reading_mc": [{"title": "【短文一】瘦瘦針改變食品市場", "text": "「GLP-1」是我們腸道分泌的一種荷爾蒙，它會讓人比較快覺得飽，吃得比較少。最近幾年，使用 GLP-1 藥物（俗稱「瘦瘦針」）減重的人越來越多，全球的食品市場也跟著改變。研究發現，使用者買含糖飲料的量下降了約 7%，大約四分之一的使用者不再喝酒。因此，很多食品公司開始調整產品：從「高份量、高刺激」轉向「小份量、高營養密度」，例如高蛋白、高纖維的小包裝食品。有人說，GLP-1 改變的不只是人的體重，而是整個食品市場的樣子。", "qs": [{"n": 1, "q": "「GLP-1」是什麼？", "opts": ["一種運動的名字", "腸道分泌的一種荷爾蒙", "一種新的食物", "一家食品公司"]}, {"n": 2, "q": "使用 GLP-1 的人，買含糖飲料的量有什麼改變？", "opts": ["下降了約 7%", "上升了約 7%", "下降了約 70%", "完全沒有改變"]}, {"n": 3, "q": "「營養密度」高的食品，最可能是下面哪一種？", "opts": ["份量很大、熱量很高的食品", "顏色很漂亮的食品", "份量不大，但是營養很豐富的食品", "很甜、很好喝的飲料"]}, {"n": 4, "q": "食品公司為什麼要調整產品方向？", "opts": ["因為政府規定他們改變", "因為食材越來越貴", "因為工廠不夠大", "因為使用 GLP-1 的消費者吃得變少，需求改變了"]}]}, {"title": "【短文二】麥當勞的無塑包裝", "text": "很多速食店的包裝紙裡有一層塑膠「淋膜」，可以防油、防水，但是不容易回收。台灣麥當勞從 2025 年起，全面改用「無塑膠淋膜包裝紙」，用天然澱粉和矽基塗佈取代塑膠淋膜，防油效果跟原來一樣好。這個改變讓麥當勞每年減少 86 噸塑膠，差不多等於少用 430 萬個塑膠袋。不過，新包裝的成本比較高，每個漢堡大約要多 0.5 元。麥當勞認為，為了讓包裝對環境更友善，這是值得的投資。", "qs": [{"n": 5, "q": "包裝紙裡的塑膠「淋膜」有什麼功能？", "opts": ["防油、防水", "讓食物變得更好吃", "讓包裝變得更便宜", "讓食物保溫更久"]}, {"n": 6, "q": "台灣麥當勞的新包裝紙，用什麼取代塑膠淋膜？", "opts": ["鋁箔", "更厚的紙", "天然澱粉和矽基塗佈", "玻璃材料"]}, {"n": 7, "q": "根據短文，下面哪一個是正確的？", "opts": ["新包裝的防油效果比較差", "新包裝讓麥當勞每年減少 86 噸塑膠", "新包裝的成本比較低", "新包裝裡有更多塑膠"]}]}, {"title": "【短文三】實驗室「種」出來的鰻魚", "text": "鰻魚飯是日本的名菜，但是野生鰻魚的數量在過去十年減少了 90–95%，已經成為瀕危物種。鰻魚需要在大海和河流之間洄游，很難用一般的方式養殖，所以市場上長期供不應求。現在，有科技公司用「類器官」技術，在實驗室裡培植鰻魚肉。這種培植肉不但不需要抗生素和激素，而且味道跟真的鰻魚很接近。雖然有些人覺得「實驗室種出來的肉」很奇怪，但是支持的人認為，這是既能保護瀕危動物、又能繼續享受美食的永續方法。", "qs": [{"n": 8, "q": "野生鰻魚的數量，在過去十年減少了多少？", "opts": ["30–40%", "50–60%", "70–80%", "90–95%"]}, {"n": 9, "q": "「供不應求」的意思最接近下面哪一個？", "opts": ["供應的比需要的多", "想買的人很多，但是東西不夠", "沒有人想買", "價格越來越便宜"]}, {"n": 10, "q": "根據短文，培植鰻魚肉有什麼優點？", "opts": ["不需要使用抗生素和激素", "比野生鰻魚便宜很多", "營養是野生鰻魚的兩倍", "在家裡就可以自己做"]}]}], "reading_sa": [{"title": "【短文四】AI 幫餐廳減少剩食", "text": "全球餐飲業每年因為食物浪費，損失超過 100 億美元。從採購食材到上菜，大約有 5–15% 的食材會在中間流失。現在，有餐廳開始使用 AI 影像辨識系統：廚師把要丟掉的食物放到鏡頭下，系統就會自動辨識這是哪一種食材、有多重、值多少錢。餐廳老闆看了系統的報告，就知道哪些食材最常被浪費，然後可以改變採購的量，或是重新設計菜單。有公司統計，使用這種系統的餐廳，投資回報率（ROI）最高可以達到 12 倍。", "qs": [{"n": 11, "q": "AI 影像辨識系統怎麼幫餐廳減少剩食？請說明系統做了什麼，餐廳老闆又可以怎麼使用這些資料。"}, {"n": 12, "q": "如果你是餐廳老闆，你願意花錢使用這種 AI 系統嗎？請寫出你的決定，並說出兩個理由。"}]}, {"title": "【短文五】沒有可可豆的巧克力", "text": "全球 75% 以上的可可豆來自西非，但是極端天氣和病蟲害讓可可豆的收成變差、價格大漲，這就是「可可危機」。為了解決這個問題，有公司開始研發「無可可巧克力」：用葡萄籽、葵花籽這些食品工廠的剩料來做，吃起來像巧克力，但是完全不用可可豆，而且跟傳統可可相比，可以減少 95% 的用水量。調查發現，在 25–34 歲的年輕人中，有 55% 願意嘗試這種新型巧克力。", "qs": [{"n": 13, "q": "為什麼會有「可可危機」？請根據短文，說出兩個原因。"}, {"n": 14, "q": "你覺得「無可可巧克力」會成功嗎？請從消費者的角度說明你的看法。（可以想一想：味道、價格、環保、心理的感覺……）"}]}], "vocab": [{"n": 15, "type": "mc", "q": "「野生鰻魚已經成為<font color=\"#0f3460\">瀕危</font>物種」，「瀕危」的意思是：", "opts": ["數量越來越多", "正在生病", "快要滅絕，有消失的危險", "攻擊性很強，很危險"]}, {"n": 16, "type": "mc", "q": "「這是一種<font color=\"#0f3460\">永續</font>的方法」，「永續」的意思最接近：", "opts": ["永遠不能改變", "可以長期繼續下去，不傷害環境和未來", "價格持續上漲", "二十四小時都營業"]}, {"n": 17, "type": "mc", "q": "「機能性啤酒裡加了<font color=\"#0f3460\">益生菌</font>」，「益生菌」是：", "opts": ["讓人生病的細菌", "一種酒精", "一種香料", "對身體有好處的細菌"]}, {"n": 18, "type": "mc", "q": "下面哪一種食物的蛋白質，主要是「植物蛋白」？", "opts": ["牛排", "雞蛋", "豆腐", "起司"]}, {"n": 19, "type": "write", "q": "請用「不但……而且……」寫一句話，介紹培植肉（人造肉）的優點：", "opts": null}, {"n": 20, "type": "write", "q": "請用「雖然……但是……」寫一句話，說說你對「無可可巧克力」的看法：", "opts": null}, {"n": 21, "type": "mc", "q": "「野生鰻魚的數量<font color=\"#0f3460\">節節下降</font>」，「節節下降」的意思是：", "opts": ["上上下下，不穩定", "慢慢上升", "完全沒有改變", "一直往下降"]}, {"n": 22, "type": "mc", "q": "「AI 系統幫餐廳減少<font color=\"#0f3460\">剩食</font>」，「剩食」的意思最接近：", "opts": ["剩下來、被浪費的食物", "最重要的主食", "飯後的甜點", "很貴的食物"]}, {"n": 23, "type": "mc", "q": "根據這學期讀過的文章，請選出正確的句子：", "opts": ["螺旋藻的蛋白質含量比雞肉高。", "全球的可可豆大部分來自南美洲。", "麥當勞新包裝的防油效果比舊包裝差。", "使用 GLP-1 的人會買更多含糖飲料。"]}, {"n": 24, "type": "mc", "q": "麥當勞「用對環境比較好的材料，取代塑膠淋膜」，這最符合 5R 永續包裝策略中的哪一個？", "opts": ["Reduce（減量）", "Replace（替代）", "Recycle（回收）", "Rethink（重新思考）"]}], "rewrite": "「台灣麥當勞從 2025 年起，全面改用無塑膠淋膜包裝紙，用天然澱粉和矽基塗佈取代塑膠淋膜。這個改變讓麥當勞每年減少 86 噸塑膠，差不多等於少用 430 萬個塑膠袋，而且新包裝的防油效果跟原來一樣好。」", "essay_req": "共同要求：(1) 結構：立場 → 理由 → 例子 → 結論；(2) 至少使用 2 個本學期的生詞（例如：永續、瀕危、剩食、回收、營養密度、供不應求……），並用【　】標出來，例如：【永續】；(3) 至少使用 1 個轉折句型：雖然……但是……／不是……而是……／不但……而且……", "essay_a": "題目 A：這學期我們認識了幾種新的食品科技，例如：培植肉（人造肉）、無可可巧克力、用 AI 減少剩食。你最支持哪一種？為什麼？", "essay_b": "題目 B：為了環保，你願意多付一點錢嗎？台灣麥當勞換了新的環保包裝，每個漢堡的成本多了 0.5 元。如果環保的食物或包裝要多花一點錢，你願意嗎？請說明你的看法，並舉出你自己生活中（或你的國家）的例子。"}, SUPA_URL="https://qmldcjkllisvfgegkfsz.supabase.co", SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbGRjamtsbGlzdmZnZWdrZnN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMjM5ODYsImV4cCI6MjA4NjY5OTk4Nn0.Bfj0W7HN_n_vcjGe5502Chamk0YV-de8a0fxF4Nyczk";
var SID="",NAME="",T0=0,SESS="cexam_"+Math.floor(Date.now()/1000),submitted=false,timer=null,LIMIT=120*60;

function gp(){ // GET 該學號是否已交卷（一次性）
  return fetch(SUPA_URL+"/rest/v1/interactions?course_code=eq.chinese-final-exam&student_id=eq."+encodeURIComponent(SID)+"&select=id",
    {headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){return r.json();});
}
function startExam(){
  SID=document.getElementById('gsid').value.trim(); NAME=document.getElementById('gname').value.trim();
  if(!SID||!NAME){document.getElementById('gmsg').textContent='請輸入學號和姓名。';return;}
  var btn=document.getElementById('gbtn'); btn.disabled=true; document.getElementById('gmsg').textContent='檢查中…';
  gp().then(function(rows){
    if(Array.isArray(rows)&&rows.length>0){ document.getElementById('gmsg').textContent='這個學號已經交卷過了,無法再次作答。如有問題請找老師。'; btn.disabled=false; return; }
    render(); document.getElementById('gate').classList.add('hide');
    document.getElementById('exam').classList.remove('hide'); document.getElementById('bar').classList.remove('hide');
    document.getElementById('timer').classList.remove('hide');
    T0=Date.now(); startTimer();
  }).catch(function(){ document.getElementById('gmsg').textContent='連線異常,請檢查網路後再試。'; btn.disabled=false; });
}
function startTimer(){
  timer=setInterval(function(){
    var left=LIMIT-Math.floor((Date.now()-T0)/1000);
    if(left<=0){ left=0; clearInterval(timer); submitExam(true); }
    var m=Math.floor(left/60),s=left%60;
    document.getElementById('tleft').textContent=m+':'+(s<10?'0':'')+s;
    if(left<=300)document.getElementById('timer').classList.add('warn');
  },1000);
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function mcQ(n,q,opts){
  var h='<p class="q"><span class="n">'+n+'.</span>'+esc(q)+'</p>';
  opts.forEach(function(o,j){h+='<label class="opt" id="o'+n+'_'+j+'" onclick="pick('+n+','+j+')">'+'ABCD'[j]+'. '+esc(o)+'</label>';});
  return h;
}
function taQ(n,q,rows,ph){return '<p class="q"><span class="n">'+n+'.</span>'+esc(q)+'</p><textarea id="t'+n+'" rows="'+(rows||3)+'" placeholder="'+(ph||'')+'"></textarea>';}
function render(){
  var e=document.getElementById('exam'),h='';
  // 壹 閱讀選擇
  h+='<div class="sec-h">壹、閱讀測驗——選擇題（每題 2 分，共 20 分）</div>';
  DATA.reading_mc.forEach(function(p){ h+='<div class="card"><div class="ptitle">'+esc(p.title)+'</div><div class="passage">'+esc(p.text)+'</div>';
    p.qs.forEach(function(q){h+=mcQ(q.n,q.q,q.opts);}); h+='</div>'; });
  // 貳 閱讀簡答
  h+='<div class="sec-h">貳、閱讀測驗——簡答題（每題 5 分，共 20 分）</div>';
  DATA.reading_sa.forEach(function(p){ h+='<div class="card"><div class="ptitle">'+esc(p.title)+'</div><div class="passage">'+esc(p.text)+'</div>';
    p.qs.forEach(function(q){h+=taQ(q.n,'（5 分）'+q.q,4,'請用完整的句子回答,至少 2～3 句');}); h+='</div>'; });
  // 參 詞彙與語法
  h+='<div class="sec-h">參、詞彙與語法（每題 2 分，共 20 分）</div><div class="card">';
  DATA.vocab.forEach(function(v){ h+= v.type==='mc' ? mcQ(v.n,v.q,v.opts) : taQ(v.n,v.q,2,'請造一個完整的句子'); });
  h+='</div>';
  // 肆 寫作
  h+='<div class="sec-h">肆、寫作題（共 40 分）</div>';
  h+='<div class="card"><div class="ptitle">第一題：短文改寫（15 分）</div><p class="hint">請用自己的話把下面這段話重新寫一遍（80～120 字），不可以抄原文。</p><div class="passage">'+esc(DATA.rewrite)+'</div>'+'<textarea id="t_rewrite" rows="6" placeholder="在這裡作答（80～120 字）"></textarea></div>';
  h+='<div class="card essaybox"><div class="ptitle">第二題：觀點寫作（25 分，150～250 字）</div><p class="hint">'+esc(DATA.essay_req)+'</p>'
    +'<label><input type="radio" name="ec" value="A" onclick="ess(\'A\')"> '+esc(DATA.essay_a)+'</label>'
    +'<label><input type="radio" name="ec" value="B" onclick="ess(\'B\')"> '+esc(DATA.essay_b)+'</label>'
    +'<textarea id="t_essay" rows="9" placeholder="先在上面選 A 或 B,再在這裡作答（150～250 字）"></textarea></div>';
  e.innerHTML=h;
}
var MC={}, ECHOICE="";
function pick(n,j){ if(submitted)return; MC[n]=j;
  for(var k=0;k<5;k++){var el=document.getElementById('o'+n+'_'+k);if(el)el.classList.toggle('sel',k===j);} }
function ess(v){ ECHOICE=v; }
function collect(){
  var mc={}; Object.keys(MC).forEach(function(n){mc[n]='ABCD'[MC[n]];});
  var txt={}; document.querySelectorAll('textarea').forEach(function(t){ if(t.id.indexOf('t')===0 && t.value.trim()){ txt[t.id.replace(/^t_?/,'')]=t.value.trim(); } });
  return {mc:mc, txt:txt, essay_choice:ECHOICE};
}
function submitExam(auto){
  if(submitted)return;
  if(!auto && !confirm('確定要交卷嗎?交卷後就不能修改了。')) return;
  submitted=true; if(timer)clearInterval(timer);
  document.getElementById('submit').disabled=true;
  var a=collect(), mcCount=Object.keys(a.mc).length;
  try{
    fetch(SUPA_URL+"/rest/v1/interactions",{method:"POST",
      headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify({course_code:"chinese-final-exam",session_id:SESS,student_id:SID,student_name:NAME,
        game_id:"final-exam",game_name:"期末考(線上)",score:0,wrong:0,total:18,
        duration_ms:Date.now()-T0,client_meta:{mc:a.mc,txt:a.txt,essay_choice:a.essay_choice,mc_count:mcCount,auto:!!auto}})});
  }catch(e){}
  document.getElementById('exam').classList.add('hide'); document.getElementById('bar').classList.add('hide');
  document.getElementById('timer').classList.add('hide');
  document.getElementById('done').classList.remove('hide');
  document.getElementById('donesub').textContent='學號 '+SID+'　·　'+(auto?'時間到自動交卷':'已送出');
  window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('beforeunload',function(e){ if(!submitted && T0){ e.preventDefault(); e.returnValue=''; } });
</script></body></html>
