<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期末考（線上）批改看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--accent:#0f3460;--accent2:#e94560;--ok:#2e7d32;--no:#c62828;--bg:#0e1530;--card:#fff;--ink:#1a1a2e;--ink2:#666;--line:#dde3ec}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:#eef2f8;color:var(--ink);line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:16px}
.hd{background:var(--accent);color:#fff;border-radius:14px;padding:18px 20px;margin:12px 0}
.hd h1{margin:0;font-size:19px}.hd .sub{opacity:.9;font-size:13px;margin-top:3px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.stat b{color:#ffd54a;font-size:18px}
.stu{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.stu h2{margin:0 0 2px;font-size:17px}.stu .meta{color:var(--ink2);font-size:13px;margin-bottom:10px}
.mcscore{font-weight:900;color:var(--accent2);font-size:18px}
.mcgrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mccell{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;border:1px solid var(--line);font-family:monospace}
.mccell.ok{background:#e7f7ee;border-color:var(--ok);color:var(--ok)}
.mccell.no{background:#fbeaea;border-color:var(--no);color:var(--no)}
.mccell.blank{background:#f3f4f6;color:#999}
.openq{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.openq .ql{font-weight:700;font-size:14px;color:var(--accent)}
.openq .ans{background:#f7f9fc;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;margin:5px 0;white-space:pre-wrap;font-size:14.5px}
.openq .ans.empty{color:#999;border-color:#ccc;font-style:italic}
.openq .ref{font-size:12.5px;color:var(--ink2);margin:2px 0 8px;padding-left:4px}
.toggle{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2);font-family:inherit}
#lock{position:fixed;inset:0;z-index:99;background:radial-gradient(800px 500px at 50% 0%,#1b2550,var(--bg));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center}
#lock h2{color:#fff;font-size:1.5rem;margin:0}#lock p{color:#aab;font-size:.9rem;max-width:320px}
#lock input{width:min(300px,80vw);padding:13px;border-radius:10px;border:1px solid #445;background:rgba(255,255,255,.08);color:#fff;font-size:1.1rem;text-align:center;font-family:inherit}
#lock button{width:min(300px,80vw);padding:13px;border-radius:10px;border:none;background:var(--accent2);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit}
#pwerr{color:#ff7b9c;font-size:.85rem;min-height:1em}
.empty{text-align:center;color:var(--ink2);padding:50px 20px}
</style></head><body>
<div id="lock">
  <h2>🔒 期末考批改看板</h2><p>老師專用。輸入通關碼查看學生作答與成績。</p>
  <input id="pw" type="password" placeholder="通關碼" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">進入</button><div id="pwerr"></div>
</div>
<div class="wrap">
  <div class="hd"><h1>📝 期末考（線上）批改看板</h1>
    <div class="sub">食品營養華語文獻閱讀與寫作 II　·　選擇題自動評分，開放題請逐一批改</div>
    <div class="stat" id="stat"></div></div>
  <div style="text-align:right;margin:6px 2px"><button class="toggle" onclick="HIDEREF=!HIDEREF;render()">顯示/隱藏 參考答案</button></div>
  <div id="list"><div class="empty">載入中…</div></div>
</div>
<script>
var T={"mc": {"1": {"q": "「GLP-1」是什麼？", "ans": "B", "opts": ["一種運動的名字", "腸道分泌的一種荷爾蒙", "一種新的食物", "一家食品公司"]}, "2": {"q": "使用 GLP-1 的人，買含糖飲料的量有什麼改變？", "ans": "A", "opts": ["下降了約 7%", "上升了約 7%", "下降了約 70%", "完全沒有改變"]}, "3": {"q": "「營養密度」高的食品，最可能是下面哪一種？", "ans": "C", "opts": ["份量很大、熱量很高的食品", "顏色很漂亮的食品", "份量不大，但是營養很豐富的食品", "很甜、很好喝的飲料"]}, "4": {"q": "食品公司為什麼要調整產品方向？", "ans": "D", "opts": ["因為政府規定他們改變", "因為食材越來越貴", "因為工廠不夠大", "因為使用 GLP-1 的消費者吃得變少，需求改變了"]}, "5": {"q": "包裝紙裡的塑膠「淋膜」有什麼功能？", "ans": "A", "opts": ["防油、防水", "讓食物變得更好吃", "讓包裝變得更便宜", "讓食物保溫更久"]}, "6": {"q": "台灣麥當勞的新包裝紙，用什麼取代塑膠淋膜？", "ans": "C", "opts": ["鋁箔", "更厚的紙", "天然澱粉和矽基塗佈", "玻璃材料"]}, "7": {"q": "根據短文，下面哪一個是正確的？", "ans": "B", "opts": ["新包裝的防油效果比較差", "新包裝讓麥當勞每年減少 86 噸塑膠", "新包裝的成本比較低", "新包裝裡有更多塑膠"]}, "8": {"q": "野生鰻魚的數量，在過去十年減少了多少？", "ans": "D", "opts": ["30–40%", "50–60%", "70–80%", "90–95%"]}, "9": {"q": "「供不應求」的意思最接近下面哪一個？", "ans": "B", "opts": ["供應的比需要的多", "想買的人很多，但是東西不夠", "沒有人想買", "價格越來越便宜"]}, "10": {"q": "根據短文，培植鰻魚肉有什麼優點？", "ans": "A", "opts": ["不需要使用抗生素和激素", "比野生鰻魚便宜很多", "營養是野生鰻魚的兩倍", "在家裡就可以自己做"]}, "15": {"q": "「野生鰻魚已經成為<font color=\"#0f3460\">瀕危</font>物種」，「瀕危」的意思是：", "ans": "C", "opts": ["數量越來越多", "正在生病", "快要滅絕，有消失的危險", "攻擊性很強，很危險"]}, "16": {"q": "「這是一種<font color=\"#0f3460\">永續</font>的方法」，「永續」的意思最接近：", "ans": "B", "opts": ["永遠不能改變", "可以長期繼續下去，不傷害環境和未來", "價格持續上漲", "二十四小時都營業"]}, "17": {"q": "「機能性啤酒裡加了<font color=\"#0f3460\">益生菌</font>」，「益生菌」是：", "ans": "D", "opts": ["讓人生病的細菌", "一種酒精", "一種香料", "對身體有好處的細菌"]}, "18": {"q": "下面哪一種食物的蛋白質，主要是「植物蛋白」？", "ans": "C", "opts": ["牛排", "雞蛋", "豆腐", "起司"]}, "21": {"q": "「野生鰻魚的數量<font color=\"#0f3460\">節節下降</font>」，「節節下降」的意思是：", "ans": "D", "opts": ["上上下下，不穩定", "慢慢上升", "完全沒有改變", "一直往下降"]}, "22": {"q": "「AI 系統幫餐廳減少<font color=\"#0f3460\">剩食</font>」，「剩食」的意思最接近：", "ans": "A", "opts": ["剩下來、被浪費的食物", "最重要的主食", "飯後的甜點", "很貴的食物"]}, "23": {"q": "根據這學期讀過的文章，請選出正確的句子：", "ans": "A", "opts": ["螺旋藻的蛋白質含量比雞肉高。", "全球的可可豆大部分來自南美洲。", "麥當勞新包裝的防油效果比舊包裝差。", "使用 GLP-1 的人會買更多含糖飲料。"]}, "24": {"q": "麥當勞「用對環境比較好的材料，取代塑膠淋膜」，這最符合 5R 永續包裝策略中的哪一個？", "ans": "B", "opts": ["Reduce（減量）", "Replace（替代）", "Recycle（回收）", "Rethink（重新思考）"]}}, "sa": [{"n": 11, "q": "AI 影像辨識系統怎麼幫餐廳減少剩食？請說明系統做了什麼，餐廳老闆又可以怎麼使用這些資料。", "ref": "系統用影像辨識自動記錄被丟掉的食材種類、重量、價值（2分）；老闆根據報告調整採購量或重新設計菜單（2分）；語句通順（1分）。"}, {"n": 12, "q": "如果你是餐廳老闆，你願意花錢使用這種 AI 系統嗎？請寫出你的決定，並說出兩個理由。", "ref": "有明確決定（1分）；兩個理由各 2 分（可引用 ROI 12 倍、減少浪費省錢、成本太高等，合理即可）。"}, {"n": 13, "q": "為什麼會有「可可危機」？請根據短文，說出兩個原因。", "ref": "兩個原因各 2.5 分：①極端天氣／②病蟲害／③供應太集中（75% 來自西非），任兩項即可。"}, {"n": 14, "q": "你覺得「無可可巧克力」會成功嗎？請從消費者的角度說明你的看法。（可以想一想：味道、價格、環保、心理的感覺……）", "ref": "有明確看法（1分）；從消費者角度說明理由（味道、價格、環保、心理感覺等，3分）；語句通順（1分）。"}], "wr": [{"n": 19, "q": "請用「不但……而且……」寫一句話，介紹培植肉（人造肉）的優點：", "ref": "培植肉不但不需要抗生素和激素，而且味道跟真的肉很接近。（合理即給分）"}, {"n": 20, "q": "請用「雖然……但是……」寫一句話，說說你對「無可可巧克力」的看法：", "ref": "雖然無可可巧克力沒有用可可豆，但是它對環境比較友善，我願意試試看。（合理即給分）"}], "rewrite": "「台灣麥當勞從 2025 年起，全面改用無塑膠淋膜包裝紙，用天然澱粉和矽基塗佈取代塑膠淋膜。這個改變讓麥當勞每年減少 86 噸塑膠，差不多等於少用 430 萬個塑膠袋，而且新包裝的防油效果跟原來一樣好。」", "essay_a": "題目 A：這學期我們認識了幾種新的食品科技，例如：培植肉（人造肉）、無可可巧克力、用 AI 減少剩食。你最支持哪一種？為什麼？", "essay_b": "題目 B：為了環保，你願意多付一點錢嗎？台灣麥當勞換了新的環保包裝，每個漢堡的成本多了 0.5 元。如果環保的食物或包裝要多花一點錢，你願意嗎？請說明你的看法，並舉出你自己生活中（或你的國家）的例子。"}, SUPA_URL="https://qmldcjkllisvfgegkfsz.supabase.co", SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbGRjamtsbGlzdmZnZWdrZnN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMjM5ODYsImV4cCI6MjA4NjY5OTk4Nn0.Bfj0W7HN_n_vcjGe5502Chamk0YV-de8a0fxF4Nyczk", PASS="meiho2026";
var ROWS=[], HIDEREF=false;
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function unlock(){ if(document.getElementById('pw').value===PASS){ document.getElementById('lock').style.display='none'; load(); } else { document.getElementById('pwerr').textContent='通關碼不對。'; } }
function load(){
  fetch(SUPA_URL+"/rest/v1/interactions?course_code=eq.chinese-final-exam&select=student_id,student_name,completed_at,duration_ms,client_meta&order=completed_at.desc",
    {headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){return r.json();}).then(function(rows){
    ROWS=Array.isArray(rows)?rows:[]; render();
  }).catch(function(){ document.getElementById('list').innerHTML='<div class="empty">連線異常。</div>'; });
}
function mcScore(meta){ var mc=(meta&&meta.mc)||{}, sc=0, tot=0; for(var k in T.mc){ tot++; if(mc[k]===T.mc[k].ans) sc++; } return {sc:sc,tot:tot}; }
function render(){
  var list=document.getElementById('list');
  if(!ROWS.length){ list.innerHTML='<div class="empty">還沒有學生交卷。</div>'; document.getElementById('stat').innerHTML=''; return; }
  // 統計
  var scores=ROWS.map(function(r){return mcScore(r.client_meta).sc;});
  var avg=(scores.reduce(function(a,b){return a+b;},0)/scores.length).toFixed(1);
  document.getElementById('stat').innerHTML='已交卷 <b>'+ROWS.length+'</b> 人　·　選擇題平均 <b>'+avg+' / '+Object.keys(T.mc).length+'</b>';
  var keys=Object.keys(T.mc).sort(function(a,b){return a-b;});
  var h='';
  ROWS.forEach(function(r){
    var meta=r.client_meta||{}, mc=meta.mc||{}, txt=meta.txt||{}, s=mcScore(meta);
    var dur=meta.duration_ms?Math.round((r.duration_ms||0)/60000)+' 分':'';
    var t=r.completed_at?new Date(r.completed_at).toLocaleString('zh-TW'):'';
    h+='<div class="stu"><h2>'+esc(r.student_name)+' <span style="color:#999;font-size:14px">'+esc(r.student_id)+'</span></h2>';
    h+='<div class="meta">交卷 '+esc(t)+(dur?'　·　作答 '+dur:'')+'</div>';
    // 選擇題
    h+='<div>選擇題自動評分：<span class="mcscore">'+s.sc+' / '+s.tot+'</span></div><div class="mcgrid">';
    keys.forEach(function(k){ var my=mc[k], ans=T.mc[k].ans, cls=my==null?'blank':(my===ans?'ok':'no');
      h+='<span class="mccell '+cls+'">'+k+'. '+(my||'—')+(my&&my!==ans?'→'+ans:'')+'</span>'; });
    h+='</div>';
    // 開放題：簡答
    h+='<div class="openq">';
    T.sa.forEach(function(q){ var a=txt[q.n]; h+='<div class="ql">'+q.n+'.（簡答）'+esc(q.q)+'</div>'+ansBox(a)+refBox(q.ref); });
    T.wr.forEach(function(q){ var a=txt[q.n]; h+='<div class="ql">'+q.n+'.（造句）'+esc(q.q)+'</div>'+ansBox(a)+refBox(q.ref); });
    // 改寫
    h+='<div class="ql">改寫（15 分）</div>'+ansBox(txt['rewrite']);
    // 觀點寫作
    var ec=meta.essay_choice||'—';
    h+='<div class="ql">觀點寫作（25 分）— 選擇題目：'+esc(ec)+'</div>'+ansBox(txt['essay']);
    h+='</div></div>';
  });
  list.innerHTML=h;
}
function ansBox(a){ return a&&a.trim() ? '<div class="ans">'+esc(a)+'</div>' : '<div class="ans empty">（未作答）</div>'; }
function refBox(ref){ return (!HIDEREF && ref) ? '<div class="ref">參考：'+esc(ref)+'</div>' : ''; }
</script></body></html>
