body{font-family:'Noto Sans TC',sans-serif;background:linear-gradient(135deg,#FFE9B0 0%,#FFD876 50%,#FFB347 100%);color:#2D1A0F;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.card{background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 12px 32px rgba(45,26,15,0.08);text-decoration:none;color:inherit;transition:all .3s ease;border-top:6px solid #E63946;display:flex;flex-direction:column;align-items:center;text-align:center}
.card:nth-child(2){border-top-color:#2A9D8F}

.tools{background:rgba(255,255,255,0.4);border-radius:14px;padding:14px 20px;backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font-size:0.85rem;color:#5C3F2C}
.tools b{color:#2D1A0F}

<script>
// Session 傳遞：把 URL 的 ?session= 存進 localStorage，並加到所有內部連結
(function(){
  const session = new URLSearchParams(location.search).get('session');
  if(!session) return;
  try{ localStorage.setItem('mcd_session_id', session); }catch(e){}
  document.querySelectorAll('a').forEach(a=>{
    try{
      const href = a.getAttribute('href');
      if(!href || /^(https?:|mailto:|#)/.test(href)) return;
      const u = new URL(a.href, location.href);
      u.searchParams.set('session', session);
      a.href = u.toString();
    }catch(e){}
  });
})();
</script>
