<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包裝知識小測驗｜麥當勞無塑包裝</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBF0; --bg-2:#FFF4D6; --bg-3:#FFE9B0;
  --ink:#2D1A0F; --ink-2:#5C3F2C; --ink-3:#8A6F55; --ink-4:#B89E80;
  --accent:#E63946; --accent-2:#F4A300; --eco:#2A9D8F;
  --paper:#FFFFFF; --line:rgba(45,26,15,0.12);
  --shadow:0 8px 24px rgba(45,26,15,0.08);
  --shadow-hi:0 16px 36px rgba(230,57,70,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:linear-gradient(135deg,var(--bg) 0%,var(--bg-2) 100%);color:var(--ink);min-height:100vh;padding:24px 16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto}
.kicker{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--accent-2);font-weight:700;letter-spacing:0.2em;margin-bottom:8px}
h1{font-size:clamp(1.5rem,3.5vw,2.2rem);font-weight:900;margin-bottom:8px;line-height:1.2}
.subtitle{color:var(--ink-2);font-size:clamp(0.95rem,1.4vw,1.05rem);margin-bottom:20px}
.tag{display:inline-block;padding:4px 12px;background:var(--bg-3);border-radius:999px;font-size:0.8rem;font-weight:700;color:var(--ink);font-family:'JetBrains Mono',monospace}

.progress{background:var(--paper);padding:14px 20px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pbar{flex:1;height:10px;background:var(--bg-3);border-radius:999px;overflow:hidden;min-width:120px}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .4s ease}
.pcount{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink)}
.pscore{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--eco)}

.qcard{background:var(--paper);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.qnum{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:900;font-size:0.9rem;letter-spacing:0.15em;margin-bottom:6px}
.qtext{font-size:clamp(1.05rem,1.6vw,1.2rem);font-weight:900;color:var(--ink);margin-bottom:16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{padding:14px 18px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:1rem;font-weight:500;color:var(--ink);transition:all .2s ease;display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit}
.opt .mark{font-family:'JetBrains Mono',monospace;font-weight:900;color:var(--ink-3);min-width:24px}
.opt:hover{border-color:var(--accent-2);background:var(--bg-2);transform:translateX(4px)}
.opt:disabled{cursor:default;opacity:0.7;transform:none}
.opt.correct{background:linear-gradient(135deg,#C5E8DE,#A0D8C8);border-color:var(--eco);color:var(--ink);font-weight:700}
.opt.correct .mark{color:var(--eco)}
.opt.wrong{background:#FFCCD1;border-color:var(--accent);color:var(--ink);font-weight:700}
.opt.wrong .mark{color:var(--accent)}

.explain{display:none;margin-top:16px;padding:14px 18px;background:var(--bg-2);border-left:5px solid var(--accent-2);border-radius:10px;font-size:0.95rem;color:var(--ink-2);line-height:1.6}
.explain.show{display:block;animation:fadein .3s}
.explain b{color:var(--accent)}
@keyframes fadein{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:translateY(0)}}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{padding:12px 24px;border-radius:999px;border:none;font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;transition:all .2s ease;min-height:48px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#C0303B;transform:translateY(-2px)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--ink-4)}

.result{display:none;background:var(--paper);border-radius:20px;padding:32px;box-shadow:var(--shadow-hi);text-align:center}
.result.show{display:block;animation:popin .4s}
@keyframes popin{0%{transform:scale(0.9);opacity:0}100%{transform:scale(1);opacity:1}}
.result .big{font-family:'JetBrains Mono',monospace;font-size:3.5rem;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.result h2{font-size:1.6rem;margin-bottom:8px}
.result p{color:var(--ink-2);margin-bottom:20px}

.qr-section{background:var(--paper);padding:18px;border-radius:14px;margin-top:20px;text-align:center;box-shadow:var(--shadow)}
.qr-section img{border-radius:8px;margin-bottom:8px}
.qr-section p{font-size:0.85rem;color:var(--ink-3);font-family:'JetBrains Mono',monospace}
.nav-back{display:inline-block;margin-top:20px;padding:10px 18px;background:var(--paper);border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;box-shadow:var(--shadow);font-size:0.9rem}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">遊戲 2 / 5</span>
  <div class="kicker" style="margin-top:10px">MINIGAME · 知識挑戰</div>
  <h1>包裝知識小測驗 📝</h1>
  <p class="subtitle">5 題單選題，看看你今天聽進去多少。每題答完會立刻解答！</p>

  <div class="progress">
    <span class="pcount" id="pcount">第 1 / 5 題</span>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <span class="pscore">得分：<b id="pscore">0</b></span>
  </div>

  <div id="qholder"></div>

  <div class="result" id="result">
    <div class="big" id="finalScore">5 / 5</div>
    <h2 id="finalTitle">滿分過關！</h2>
    <p id="finalText"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn primary" onclick="restart()">🔄 再玩一次</button>
      <a href="03_vocab_flashcard.html" class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center;">下一關 →</a>
    </div>
  </div>

  <div class="qr-section">
    <img id="qr-img" width="130" height="130" alt="QR Code">
    <p>掃描分享給同學</p>
  </div>
  <a href="index.html" class="nav-back">← 回到遊戲總覽</a>
</div>

<script src="supabase-config.js"></script>
<script src="firebase-config.js"></script>
<script>
const ID = 'mcd_minigame_02';
const _startTime = Date.now();
const Q = [
  {
    q: '麥當勞「無塑膠淋膜包裝紙」每年大約能減少多少塑膠？',
    opts: ['8.6 公噸', '86 公噸', '860 公噸', '8,600 公噸'],
    ans: 1,
    why: '正確答案是 <b>86 公噸 / 年</b>，這個數字大約等於 14 隻成年非洲象的重量，是台灣麥當勞 2025 年導入的關鍵成效。'
  },
  {
    q: '「淋膜」在食品包裝裡是什麼意思？',
    opts: [
      '在紙的表面噴一層油',
      '在紙上鍍一層薄膜（常用塑膠 PE）防水防油',
      '把紙浸到水裡讓它變硬',
      '一種特殊的紙漿名稱'
    ],
    ans: 1,
    why: '<b>淋膜（lín mó）</b>是把一層薄膜鍍在紙上的工藝，傳統最常用的就是塑膠（PE）淋膜，因此紙包裝其實是「複合材料」，難以回收。'
  },
  {
    q: '麥當勞用「天然澱粉塗佈」取代塑膠淋膜，主要是為了什麼？',
    opts: [
      '讓紙變得比較香',
      '讓紙更便宜',
      '提供防油功能，同時保有可回收性',
      '增加紙的厚度當隔熱用'
    ],
    ans: 2,
    why: '澱粉塗層滲入紙纖維、形成屏障，<b>防油效果等同塑膠淋膜</b>，但材料天然可生物分解，因此回收容易。這就是替換材質（Replace）的核心。'
  },
  {
    q: '為什麼麥香魚的包裝紙要用「矽基材質」，不能跟大麥克一樣？',
    opts: [
      '矽基比較便宜',
      '因為麥香魚的麵包是蒸製的會冒水蒸氣，需要半透氣材質',
      '為了讓麵包看起來比較白',
      '矽基可以防紫外線'
    ],
    ans: 1,
    why: '麥香魚的麵包是<b>蒸熟的</b>，會持續冒蒸氣。如果包太密，蒸氣悶在裡面麵包就會濕黏。矽基材質可以「擋油擋水、放蒸氣通過」，是專門為這種食品設計的。'
  },
  {
    q: '這個減塑專案總共動員了麥當勞內部多少個部門協作？',
    opts: ['3 個', '7 個', '13 個', '30 個'],
    ans: 2,
    why: '專案歷時近 3 年，跨越 <b>13 個部門</b>（採購、研發、供應鏈、營運、行銷等），上游供應商還親自進到餐廳觀察員工怎麼操作，是典型的「跨部門共創」。'
  }
];

let idx = 0, score = 0, answered = false;

function render(){
  const c = Q[idx];
  const opts = c.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span class="mark">${'ABCD'[i]}</span>${o}</button>`).join('');
  document.getElementById('qholder').innerHTML = `
    <div class="qcard">
      <div class="qnum">QUESTION ${idx+1} / ${Q.length}</div>
      <div class="qtext">${c.q}</div>
      <div class="opts" id="opts">${opts}</div>
      <div class="explain" id="explain"></div>
      <div class="actions" id="qactions" style="display:none">
        <button class="btn primary" onclick="next()">${idx+1<Q.length?'下一題 →':'看結果 🏁'}</button>
      </div>
    </div>`;
  document.getElementById('pcount').textContent = '第 '+(idx+1)+' / '+Q.length+' 題';
  document.getElementById('pfill').style.width = ((idx)/Q.length*100)+'%';
  answered = false;
}

function pick(i){
  if(answered) return;
  answered = true;
  const c = Q[idx];
  const btns = document.querySelectorAll('#opts .opt');
  btns.forEach((b,j)=>{
    b.disabled = true;
    if(j===c.ans) b.classList.add('correct');
    else if(j===i) b.classList.add('wrong');
  });
  if(i===c.ans){
    score++;
    document.getElementById('pscore').textContent = score;
  }
  const ex = document.getElementById('explain');
  ex.innerHTML = (i===c.ans?'✅ 答對了！':'❌ 不對哦。')+' '+c.why;
  ex.classList.add('show');
  document.getElementById('qactions').style.display='flex';
  document.getElementById('pfill').style.width = ((idx+1)/Q.length*100)+'%';
}

function next(){
  idx++;
  if(idx>=Q.length) finish();
  else render();
}

function finish(){
  document.getElementById('qholder').innerHTML='';
  document.getElementById('finalScore').textContent = score+' / '+Q.length;
  let t='', txt='';
  if(score===Q.length){ t='滿分過關！🏆'; txt='你完全掌握了麥當勞無塑包裝的關鍵知識。準備好升級進階遊戲了嗎？'; }
  else if(score>=4){ t='高手！⭐'; txt='4 題以上答對，主要概念都抓到了。錯的那題回去複習一下就完美！'; }
  else if(score>=3){ t='及格！👍'; txt='答對 '+score+' 題，掌握了基本概念。建議回到簡報再聽一遍細節。'; }
  else{ t='再加油！💪'; txt='答對 '+score+' 題。沒關係，回到簡報複習，再來挑戰一次！'; }
  document.getElementById('finalTitle').textContent = t;
  document.getElementById('finalText').textContent = txt;
  document.getElementById('result').classList.add('show');
  try{
    localStorage.setItem(ID, JSON.stringify({done:true,score:score,total:Q.length,ts:Date.now()}));
  }catch(e){}
  if (window.MCDFirebase) window.MCDFirebase.recordResult({
    gameId: ID, gameName: '包裝知識小測驗',
    score: score, wrong: Q.length - score, total: Q.length,
    durationMs: Date.now() - _startTime
  });
}

function restart(){ idx=0; score=0; document.getElementById('pscore').textContent='0'; document.getElementById('result').classList.remove('show'); render(); }

render();
document.getElementById('qr-img').src='https://api.qrserver.com/v1/create-qr-code/?size=130x130&data='+encodeURIComponent(window.location.href);
</script>
</body>
</html>
