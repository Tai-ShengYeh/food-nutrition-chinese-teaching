<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>詞彙配對｜W10 機能性啤酒</title>
<style>
:root{--amber:#d97706;--amber2:#f59e0b;--amber-dim:#451a03;
  --green:#059669;--green2:#10b981;--bg:#0a0d12;--surf:#13171f;
  --surf2:#1d2230;--text:#e2e8f0;--text2:#94a3b8;--border:#1e2a3a;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;padding:24px 16px 60px}
.page{max-width:880px;margin:0 auto}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:1.6rem;font-weight:800;color:var(--amber2)}
.header p{color:var(--text2);font-size:.9rem;margin-top:6px}
.score-bar{background:var(--surf);border:1px solid var(--border);border-radius:30px;
  padding:8px 20px;display:inline-flex;align-items:center;gap:10px;
  font-size:.85rem;margin-bottom:20px}
.score-val{font-size:1.2rem;font-weight:800;color:var(--amber2)}
/* game board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.col-head{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text2);margin-bottom:10px}
.card{background:var(--surf);border:2px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;transition:.2s;font-size:.88rem;line-height:1.5;
  user-select:none}
.card:hover{border-color:var(--amber);color:var(--amber2)}
.card.selected{border-color:var(--amber2);background:var(--amber-dim);color:var(--amber2)}
.card.matched{border-color:var(--green);background:var(--green-dim,#022c22);
  color:var(--green2);cursor:default;opacity:.85}
.card.wrong{border-color:#ef4444;background:#450a0a;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result-msg{text-align:center;font-size:1.1rem;font-weight:700;
  color:var(--green2);display:none;margin:16px 0;padding:16px;
  background:var(--surf);border:1px solid var(--green);border-radius:var(--radius)}
.restart-btn{display:block;margin:16px auto 0;background:var(--amber);color:#0a0d12;
  border:none;border-radius:8px;padding:10px 28px;font-size:.9rem;font-weight:700;cursor:pointer}
.back-link{display:block;text-align:center;margin-top:16px;
  font-size:.82rem;color:var(--text2);text-decoration:none}
.back-link:hover{color:var(--amber2)}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>🔤 詞彙配對</h1>
    <p>W10 機能性啤酒｜將左欄成分名稱與右欄功效說明配對</p>
  </div>
  <div style="text-align:center">
    <div class="score-bar">
      配對進度 <span class="score-val" id="scoreVal">0</span> / <span id="totalPairs">0</span>
      ｜嘗試 <span id="attempts">0</span> 次
    </div>
  </div>

  <div class="board">
    <div>
      <div class="col-head">成分名稱</div>
      <div id="leftCol"></div>
    </div>
    <div>
      <div class="col-head">功效說明</div>
      <div id="rightCol"></div>
    </div>
  </div>

  <div class="result-msg" id="resultMsg"></div>
  <button class="restart-btn" id="restartBtn" style="display:none" onclick="initGame()">🔄 再玩一次</button>
  <a class="back-link" href="../slides.html">← 回投影片</a>
</div>

<script>
const PAIRS = [
  {term:'益生菌 / 乳酸菌', def:'每份含 10 億 CFU，支援腸道菌相'},
  {term:'CFU',             def:'Colony Forming Units，菌落形成單位，衡量活菌數量'},
  {term:'甲肌肽 Anserine', def:'天然二肽，減少尿酸堆積，加速尿酸排除'},
  {term:'猴頭菇',          def:'Lion\'s Mane Mushroom，支持壓力調節，可能促進 NGF'},
  {term:'南非醉茄 Ashwagandha', def:'促進 GABA 生成，降低皮質醇（壓力荷爾蒙）'},
  {term:'L-茶胺酸',        def:'茶葉天然成分，提升血清素與多巴胺，帶來清醒放鬆感'},
  {term:'ABV',             def:'Alcohol By Volume，酒精含量百分比'},
  {term:'普林 Purine',     def:'核酸代謝產物，高普林食物可能增加痛風風險'},
];

const SB_URL='https://qmldcjkllisvfgegkfsz.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbGRjamtsbGlzdmZnZWdrZnN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMjM5ODYsImV4cCI6MjA4NjY5OTk4Nn0.Bfj0W7HN_n_vcjGe5502Chamk0YV-de8a0fxF4Nyczk';
const COURSE='w10-functional-beer';
const SESSION=COURSE+'-'+new Date().toISOString().slice(0,10);

let selected=null,matched=0,attempts=0,startTime=Date.now();

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function initGame(){
  selected=null;matched=0;attempts=0;startTime=Date.now();
  document.getElementById('scoreVal').textContent='0';
  document.getElementById('attempts').textContent='0';
  document.getElementById('totalPairs').textContent=PAIRS.length;
  document.getElementById('resultMsg').style.display='none';
  document.getElementById('restartBtn').style.display='none';

  const left=shuffle(PAIRS);
  const right=shuffle(PAIRS);
  const lc=document.getElementById('leftCol');
  const rc=document.getElementById('rightCol');
  lc.innerHTML='';rc.innerHTML='';

  left.forEach(p=>{
    const d=document.createElement('div');
    d.className='card';d.dataset.id=PAIRS.indexOf(p);d.dataset.side='left';
    d.textContent=p.term;d.style.marginBottom='10px';
    d.onclick=()=>handleClick(d);
    lc.appendChild(d);
  });
  right.forEach(p=>{
    const d=document.createElement('div');
    d.className='card';d.dataset.id=PAIRS.indexOf(p);d.dataset.side='right';
    d.textContent=p.def;d.style.marginBottom='10px';
    d.onclick=()=>handleClick(d);
    rc.appendChild(d);
  });
}

function handleClick(card){
  if(card.classList.contains('matched'))return;
  if(!selected){
    selected=card;card.classList.add('selected');
  } else {
    if(selected===card){selected.classList.remove('selected');selected=null;return;}
    attempts++;
    document.getElementById('attempts').textContent=attempts;
    const sameItem=selected.dataset.id===card.dataset.id;
    const diffSide=selected.dataset.side!==card.dataset.side;
    if(sameItem&&diffSide){
      [selected,card].forEach(c=>{c.classList.remove('selected');c.classList.add('matched');c.onclick=null;});
      matched++;
      document.getElementById('scoreVal').textContent=matched;
      if(matched===PAIRS.length) endGame();
    } else {
      [selected,card].forEach(c=>{c.classList.add('wrong');setTimeout(()=>c.classList.remove('wrong'),350);});
      selected.classList.remove('selected');
    }
    selected=null;
  }
}

async function endGame(){
  const dur=Math.round((Date.now()-startTime)/1000);
  const score=Math.max(0,Math.round((PAIRS.length/Math.max(attempts,PAIRS.length))*100));
  document.getElementById('resultMsg').style.display='block';
  document.getElementById('resultMsg').textContent=
    `🎉 全部配對完成！嘗試 ${attempts} 次，耗時 ${dur} 秒，得分 ${score} 分`;
  document.getElementById('restartBtn').style.display='block';
  try{
    await fetch(`${SB_URL}/rest/v1/interactions`,{
      method:'POST',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({course_code:COURSE,session_id:SESSION,
        student_id:'anon-'+Math.random().toString(36).slice(2,8),
        game_id:'01-vocab-match',game_name:'詞彙配對',
        score,total:100,duration_ms:Date.now()-startTime,
        client_meta:{attempts}})
    });
  }catch(e){}
}
initGame();
</script>
</body>
</html>
