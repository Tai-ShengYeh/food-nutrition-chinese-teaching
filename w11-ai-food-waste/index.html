<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap');

:root {
  --bg:   #0D1B2A;
  --card: #1A3050;
  --card2:#102038;
  --pri:  #00C6FF;
  --gold: #FFD700;
  --acc:  #FF4D8D;
  --grn:  #00E676;
  --vio:  #A78BFA;
  --txt:  #ECEEF2;
  --muted:#7A91B0;
  --bdr:  rgba(0,198,255,.22);
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background:var(--bg);color:var(--txt);
  height:100vh;overflow:hidden;user-select:none;
}

/* progress */
#prog{position:fixed;top:0;left:0;height:4px;background:var(--pri);transition:width .35s ease;z-index:200;}

/* deck */
#deck{width:100vw;height:100vh;position:relative;}
.slide{
  position:absolute;inset:0;
  padding:48px 68px 68px;
  opacity:0;pointer-events:none;
  transition:opacity .38s ease, transform .38s ease;
  transform:translateX(30px);
}
.slide.active{opacity:1;pointer-events:all;transform:translateX(0);}
.slide.out   {opacity:0;transform:translateX(-30px);}

/* nav */
#nav{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:18px;z-index:200;
}
.nb{
  width:42px;height:42px;border-radius:50%;
  border:2px solid var(--bdr);background:rgba(26,48,80,.85);
  color:var(--pri);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;backdrop-filter:blur(8px);
}
.nb:hover{background:var(--pri);color:var(--bg);border-color:var(--pri);}
#ctr{font-size:13px;color:var(--muted);min-width:52px;text-align:center;}

/* type */
.badge{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;
  padding:4px 12px;border-radius:4px;
  background:rgba(0,198,255,.13);color:var(--pri);
  border:1px solid rgba(0,198,255,.28);margin-bottom:18px;
}
.slide-title{
  font-family:'Noto Serif TC',serif;
  font-size:clamp(34px,4.2vw,54px);font-weight:700;line-height:1.25;
  margin-bottom:10px;
}
.subtitle{font-size:clamp(16px,1.7vw,21px);color:var(--muted);margin-bottom:28px;}
.rule{width:46px;height:3px;background:var(--pri);margin-bottom:28px;}

/* cards */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:22px 26px;}
.ct{font-size:14px;font-weight:700;color:var(--pri);letter-spacing:.05em;margin-bottom:10px;}

/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* list */
ul{list-style:none;}
.dl li{padding-left:18px;position:relative;margin-bottom:7px;font-size:clamp(14px,1.45vw,18px);line-height:1.7;}
.dl li::before{content:'▸';color:var(--pri);position:absolute;left:0;}

/* highlights */
.hp{color:var(--pri);font-weight:700;}
.hg{color:var(--gold);font-weight:700;}
.ha{color:var(--acc);font-weight:700;}
.hv{color:var(--grn);font-weight:700;}

/* quote */
.q{
  border-left:4px solid var(--pri);padding:10px 18px;
  background:rgba(0,198,255,.06);border-radius:0 8px 8px 0;
  font-style:italic;color:#B0C2DA;line-height:1.8;
}

/* table */
table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.3vw,16px);}
th{background:rgba(0,198,255,.13);color:var(--pri);padding:9px 13px;text-align:left;font-weight:700;border-bottom:1px solid var(--bdr);}
td{padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top;}
tr:hover td{background:rgba(255,255,255,.025);}

/* step */
.step{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
.snum{width:34px;height:34px;border-radius:50%;background:var(--pri);color:var(--bg);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}

/* kw tag */
.kw{display:inline-block;padding:3px 9px;border-radius:4px;font-size:13px;font-weight:600;margin:3px;}

/* struct */
.srow{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.slabel{min-width:90px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
.sbar{height:26px;border-radius:4px;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600;color:var(--bg);}

/* footer */
.ft{position:absolute;bottom:20px;left:68px;right:68px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(122,145,176,.55);}
.fd{width:4px;height:4px;border-radius:50%;background:var(--pri);}

/* tag pill */
.tag{display:inline-block;padding:5px 15px;border:1px solid rgba(0,198,255,.35);border-radius:20px;font-size:13px;color:var(--pri);margin-right:8px;margin-bottom:6px;}
</style>
</head>

/* ── Engine ── */
const deck    = document.getElementById('deck');
const prog    = document.getElementById('prog');
const ctr     = document.getElementById('ctr');
const TOTAL   = SLIDES.length;
let   current = 0;
let   chartInstances = [];

function render() {
  chartInstances.forEach(c => { try { c.destroy(); } catch(e){} });
  chartInstances = [];
  deck.innerHTML = '';

  SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === current ? ' active' : (i < current ? ' out' : ''));
    el.innerHTML = s.html;
    deck.appendChild(el);
  });

  const active = SLIDES[current];
  if (active && active.onMount) {
    requestAnimationFrame(() => {
      const inst = active.onMount();
      if (inst) chartInstances.push(inst);
    });
  }

  prog.style.width = ((current + 1) / TOTAL * 100) + '%';
  ctr.textContent  = (current + 1) + ' / ' + TOTAL;
}

function go(dir) {
  current = Math.max(0, Math.min(TOTAL - 1, current + dir));
  render();
}

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')                    { e.preventDefault(); go(-1); }
});

render();
</script>
