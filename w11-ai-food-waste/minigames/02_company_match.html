<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公司配對｜W11 AI 餐飲剩食革命</title>
<style>
:root{--g:#059669;--g2:#047857;--gd:#d1fae5;--blue:#2563eb;--gold:#ea580c;
  --bg:#f8fafc;--surf:#ffffff;--surf2:#eef2f7;
  --text:#1f2937;--text2:#4b5563;--border:#e2e8f0;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;font-size:17px;padding:24px 16px 60px}
.page{max-width:940px;margin:0 auto}
h1{font-size:1.6rem;font-weight:800;color:var(--g2);text-align:center;margin-bottom:6px}
.subtitle{color:var(--text2);font-size:.88rem;text-align:center;margin-bottom:24px}
/* company headers */
.companies{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.co-card{background:var(--surf);border:2px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:center}
.co-name{font-size:1.2rem;font-weight:800}
.co-tag{font-size:.72rem;font-weight:700;margin-top:4px;color:var(--text2)}
.co-zone{min-height:100px;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;
  justify-content:center;padding:8px;border:1px dashed var(--border);border-radius:8px}
.co-zone.over{border-color:var(--g2)}
/* fact chips */
.fact-pool{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px}
.fact-chip{background:var(--surf2);border:2px solid var(--border);border-radius:8px;
  padding:7px 13px;cursor:grab;font-size:.82rem;font-weight:600;user-select:none;transition:.15s}
.fact-chip:hover{border-color:var(--g2)}
.placed-fact{font-size:.78rem;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600}
.placed-fact.correct{background:var(--gd);border:1px solid var(--g);color:var(--g2)}
.placed-fact.wrong{background:#fee2e2;border:1px solid #dc2626;color:#b91c1c}
.placed-fact.pending{background:var(--surf2);border:1px solid var(--border);color:var(--text2)}
.check-btn{display:block;margin:0 auto;background:var(--g);color:#fff;
  border:none;border-radius:8px;padding:10px 32px;font-size:.9rem;font-weight:700;cursor:pointer}
.result{text-align:center;margin-top:16px;padding:14px;background:var(--surf);
  border:1px solid var(--g);border-radius:var(--radius);display:none;font-weight:700;color:var(--g2)}
.restart-btn{margin-top:10px;background:var(--g);color:#fff;border:none;
  border-radius:8px;padding:8px 24px;font-size:.85rem;font-weight:700;cursor:pointer}
.back{display:block;text-align:center;margin-top:14px;font-size:.82rem;color:var(--text2);text-decoration:none}
.back:hover{color:var(--g2)}
@media(max-width:580px){.companies{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <h1>🏢 公司配對</h1>
  <div class="subtitle">W11 AI 餐飲剩食革命｜將數據/特色卡片拖到正確的 AI 公司</div>

  <div style="font-size:.8rem;color:var(--text2);text-align:center;margin-bottom:14px">
    👆 從下方卡片拖放到公司，點擊已放的卡片可取回
  </div>

  <div class="fact-pool" id="pool"></div>

  <div class="companies">
    <div class="co-card" style="border-color:var(--blue)">
      <div class="co-name" style="color:var(--blue)">Winnow</div>
      <div class="co-tag">無接觸全自動追蹤</div>
      <div class="co-zone" id="zone0"
        ondragover="event.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')"
        ondrop="drop(event,0)"></div>
    </div>
    <div class="co-card" style="border-color:var(--g)">
      <div class="co-name" style="color:var(--g2)">Orbisk</div>
      <div class="co-tag">隨插即用影像辨識</div>
      <div class="co-zone" id="zone1"
        ondragover="event.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')"
        ondrop="drop(event,1)"></div>
    </div>
    <div class="co-card" style="border-color:var(--gold)">
      <div class="co-name" style="color:var(--gold)">Leanpath</div>
      <div class="co-tag">AI 預防性引導流程</div>
      <div class="co-zone" id="zone2"
        ondragover="event.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')"
        ondrop="drop(event,2)"></div>
    </div>
  </div>

  <button class="check-btn" onclick="check()">確認答案</button>
  <div class="result" id="result"></div>
  <div style="text-align:center"><button class="restart-btn" id="rb" style="display:none" onclick="init()">🔄 重試</button></div>
  <a class="back" href="../slides.html">← 回投影片</a>
</div>
<script>
const FACTS=[
  {txt:'全球 3,000+ 廚房',co:0},
  {txt:'年省 $100M USD',co:0},
  {txt:'Throw & Go 丟棄即追蹤',co:0},
  {txt:'導入 Marriott 6 個月→67%↓',co:0},
  {txt:'服務 1,000+ 企業',co:1},
  {txt:'減少 70% 浪費',co:1},
  {txt:'主攻歐洲市場',co:1},
  {txt:'導入 Fairmont 7 個月→37%↓',co:1},
  {txt:'2–7× 超高 ROI',co:2},
  {txt:'預防性引導流程（Prescriptive）',co:2},
  {txt:'行動 App 員工激勵機制',co:2},
];
const SB_URL='https://qmldcjkllisvfgegkfsz.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbGRjamtsbGlzdmZnZWdrZnN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMjM5ODYsImV4cCI6MjA4NjY5OTk4Nn0.Bfj0W7HN_n_vcjGe5502Chamk0YV-de8a0fxF4Nyczk';
const COURSE='w11-ai-food-waste';const SESSION=COURSE+'-'+new Date().toISOString().slice(0,10);
let placements={};let t0=Date.now();let dragging=null;
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function init(){
  placements={};t0=Date.now();
  document.getElementById('result').style.display='none';
  document.getElementById('rb').style.display='none';
  [0,1,2].forEach(z=>document.getElementById('zone'+z).innerHTML='');
  const pool=document.getElementById('pool');pool.innerHTML='';
  shuffle(FACTS).forEach((f,i)=>{
    const c=document.createElement('div');
    c.className='fact-chip';c.draggable=true;c.dataset.idx=i;c.id='f'+i;c.textContent=f.txt;
    c.addEventListener('dragstart',e=>{dragging=i;c.classList.add('dragging');e.dataTransfer.setData('text',i);});
    c.addEventListener('dragend',()=>c.classList.remove('dragging'));
    pool.appendChild(c);
  });
}
function drop(e,zone){
  e.preventDefault();e.target.closest('.co-zone').classList.remove('over');
  const idx=parseInt(e.dataTransfer.getData('text'));
  if(isNaN(idx))return;
  placements[idx]=zone;render();
}
function render(){
  [0,1,2].forEach(z=>{
    const zc=document.getElementById('zone'+z);zc.innerHTML='';
    Object.entries(placements).forEach(([idx,zn])=>{
      if(parseInt(zn)===z){
        const f=FACTS[parseInt(idx)];
        const c=document.createElement('div');
        c.className='placed-fact pending';c.textContent=f.txt;c.dataset.idx=idx;
        c.onclick=()=>{delete placements[idx];render();};
        zc.appendChild(c);
      }
    });
  });
  document.querySelectorAll('.fact-chip').forEach(c=>{
    c.style.display=placements.hasOwnProperty(parseInt(c.dataset.idx))?'none':'inline-flex';
  });
}
async function check(){
  let ok=0;
  Object.entries(placements).forEach(([idx,zn])=>{
    const f=FACTS[parseInt(idx)];
    document.querySelectorAll(`.placed-fact[data-idx="${idx}"]`).forEach(c=>{
      c.classList.remove('pending','correct','wrong');
      if(parseInt(zn)===f.co){ok++;c.classList.add('correct');}
      else c.classList.add('wrong');
    });
  });
  const tot=FACTS.length,placed=Object.keys(placements).length;
  const score=Math.round(ok/tot*100);
  const r=document.getElementById('result');r.style.display='block';
  r.innerHTML=`${ok===tot&&placed===tot?'🎉 全部正確！':'📊 結果：'}<strong>${ok}/${tot}</strong> 正確（得分 ${score} 分）<br>
    <span style="font-size:.8rem;color:var(--text2)">紅色 = 分類錯誤，點擊可取回重試。</span>`;
  document.getElementById('rb').style.display='inline-block';
  try{await fetch(`${SB_URL}/rest/v1/interactions`,{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({course_code:COURSE,session_id:SESSION,student_id:'anon-'+Math.random().toString(36).slice(2,8),
      game_id:'02-company-match',game_name:'公司配對',score,total:100,duration_ms:Date.now()-t0})
  });}catch(e){}
}
init();
</script>
</body>
</html>
