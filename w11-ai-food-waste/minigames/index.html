<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>W11 遊戲入口｜AI 餐飲剩食革命</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--g:#059669;--g2:#10b981;--bg:#0a0d12;--surf:#13171f;
  --surf2:#1d2230;--text:#e2e8f0;--text2:#94a3b8;--border:#1e2a3a;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;padding:32px 16px 60px;text-align:center}
h1{font-size:1.8rem;font-weight:900;color:var(--g2);margin-bottom:6px}
.sub{color:var(--text2);font-size:.9rem;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;
  max-width:860px;margin:0 auto}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 16px;text-decoration:none;color:var(--text);transition:.2s;display:block}
.card:hover{border-color:var(--g2);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.gi{font-size:2.5rem;margin-bottom:10px}
.gt{font-size:1rem;font-weight:700;color:var(--g2);margin-bottom:6px}
.gd{font-size:.8rem;color:var(--text2);line-height:1.5}
.qr{margin-top:12px}
.qr canvas{border-radius:8px}
.back{display:block;margin-top:28px;color:var(--text2);font-size:.85rem;text-decoration:none}
.back:hover{color:var(--g2)}
</style>
</head>
<body>
<h1>🗑️ W11 互動遊戲</h1>
<div class="sub">AI 餐飲剩食革命｜掃描 QR Code 或點擊直接進入</div>
<div class="grid">
  <a class="card" href="01_vocab_match.html">
    <div class="gi">🔤</div>
    <div class="gt">詞彙配對</div>
    <div class="gd">8 組關鍵詞彙 ↔ 解釋<br>剩食、ROI、ESG…</div>
    <div class="qr"><canvas id="q1"></canvas></div>
  </a>
  <a class="card" href="02_company_match.html">
    <div class="gi">🏢</div>
    <div class="gt">公司配對</div>
    <div class="gd">11 個數據/特色<br>拖到 Winnow / Orbisk / Leanpath</div>
    <div class="qr"><canvas id="q2"></canvas></div>
  </a>
  <a class="card" href="03_true_false.html">
    <div class="gi">✅</div>
    <div class="gt">是非判斷</div>
    <div class="gd">10 道數據題<br>附詳細解析</div>
    <div class="qr"><canvas id="q3"></canvas></div>
  </a>
  <a class="card" href="04_process_order.html">
    <div class="gi">🔄</div>
    <div class="gt">流程排序</div>
    <div class="gd">Throw &amp; Go 4 步驟<br>零廢棄迴圈 4 步驟（可切換）</div>
    <div class="qr"><canvas id="q4"></canvas></div>
  </a>
</div>
<a class="back" href="../slides.html">← 回投影片</a>
<script>
const base=location.href.replace('index.html','');
[['01_vocab_match','q1'],['02_company_match','q2'],
 ['03_true_false','q3'],['04_process_order','q4']].forEach(([f,id])=>{
  QRCode.toCanvas(document.getElementById(id),base+f+'.html',
    {width:120,margin:1,color:{dark:'#000',light:'#fff'}});
});
</script>
</body>
</html>
