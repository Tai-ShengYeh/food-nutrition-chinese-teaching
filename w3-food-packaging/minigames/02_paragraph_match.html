<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 2 · 句子配段落</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans TC','Be Vietnam Pro',-apple-system,sans-serif;
  background:#FFFBF0; color:#2D1A0F; min-height:100vh;
  padding:18px; line-height:1.5;
}
.wrap{max-width:920px; margin:0 auto;}
header{text-align:center; margin-bottom:18px;}
header h1{font-size:1.6rem; color:#E63946; margin-bottom:6px;}
header p{font-size:.95rem; color:#5A3D2E;}
.vn{ color:#DA251D; font-style:italic; }
.score-bar{
  display:flex; justify-content:space-between; align-items:center;
  background:#fff; padding:12px 18px; border-radius:12px;
  margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.05);
  font-weight:700;
}
.score{color:#2A9D8F; font-family:monospace;}
.sentences{ margin-bottom:18px; }
.sent-pool h3{font-size:1rem; color:#5A3D2E; margin-bottom:10px;}
.sent{
  background:#fff; border:2px solid #E5D9C7; border-radius:10px;
  padding:12px 16px; margin-bottom:8px; cursor:grab;
  font-size:1rem; min-height:50px;
  display:flex; align-items:center;
  transition:all .2s;
}
.sent:hover{ border-color:#F4A300; transform:translateY(-2px); }
.sent.placed{ display:none; }
.sent.dragging{ opacity:.4; }
.bucket-grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
}
.bucket{
  background:#fff; border:3px dashed #C7B5A6; border-radius:14px;
  padding:14px; min-height:160px;
  transition:all .2s;
}
.bucket.over{ border-color:#2A9D8F; background:#E8F4F2; }
.bucket h4{
  font-size:1rem; color:#E63946; margin-bottom:10px;
  padding-bottom:6px; border-bottom:2px solid #FFE4B8;
  display:flex; align-items:center; gap:8px;
}
.bucket .b-icon{font-size:1.4rem;}
.dropped{
  background:#E8F4F2; border:2px solid #2A9D8F; border-radius:8px;
  padding:8px 10px; margin-top:6px; font-size:.9rem; color:#2D1A0F;
  display:flex; justify-content:space-between; align-items:center;
}
.dropped.wrong{ background:#FFE5E7; border-color:#E63946; }
.dropped .remove{
  cursor:pointer; color:#8B6F5E; font-size:1.1rem; padding:0 6px;
}
.controls{ text-align:center; margin-top:18px; }
.btn{
  display:inline-block; padding:12px 28px; background:#E63946;
  color:#fff; border:none; border-radius:24px; font-weight:700;
  cursor:pointer; font-size:1rem; margin:4px;
}
.btn.green{ background:#2A9D8F; }
.btn:hover{ opacity:.85; }
.complete{
  background:#fff; padding:24px; border-radius:14px;
  text-align:center; margin-top:18px; display:none;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.complete.show{ display:block; }
.complete h2{ color:#2A9D8F; margin-bottom:10px; }
.qr-section{ text-align:center; margin-top:18px; }
.qr-section img{
  width:120px; height:120px; background:#fff;
  padding:6px; border-radius:8px;
}
.qr-section p{ font-size:.8rem; color:#8B6F5E; margin-top:6px; }
@media(max-width:600px){
  .bucket-grid{ grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 Game 2 · 句子配段落</h1>
    <p>把 8 個句子拖到對的主題盒（5R / 技術 / 結構 / 數據）</p>
  </header>

  <div class="score-bar">
    <div>已放 <span class="score" id="placed">0 / 8</span></div>
    <div>正確 <span class="score" id="correct">—</span></div>
  </div>

  <div class="sentences">
    <div class="sent-pool">
      <h3>📥 待分類的句子</h3>
      <div id="pool"></div>
    </div>
  </div>

  <div class="bucket-grid">
    <div class="bucket" data-cat="5R">
      <h4><span class="b-icon">♻️</span> 5R 框架</h4>
      <div class="bucket-items"></div>
    </div>
    <div class="bucket" data-cat="技術">
      <h4><span class="b-icon">🔬</span> 無塑技術</h4>
      <div class="bucket-items"></div>
    </div>
    <div class="bucket" data-cat="結構">
      <h4><span class="b-icon">📦</span> 包裝結構</h4>
      <div class="bucket-items"></div>
    </div>
    <div class="bucket" data-cat="數據">
      <h4><span class="b-icon">📊</span> 減塑成效</h4>
      <div class="bucket-items"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn green" onclick="checkAll()">✓ 檢查答案</button>
    <button class="btn" onclick="reset()">🔄 重玩</button>
  </div>

  <div id="complete" class="complete">
    <h2>🎉 完成！</h2>
    <p>得分：<b id="final-score" style="color:#2A9D8F;">100</b> / 100</p>
  </div>

  <div class="qr-section">
    <img id="qr-img" alt="QR">
    <p>掃描分享</p>
  </div>

  <div id="cloud-badge" style="text-align:center; margin-top:10px;
       font-family:monospace; font-size:.78rem; color:#8B6F5E;"></div>
</div>

<script src="firebase-config.js"></script>
<script src="supabase-config.js"></script>
<script src="tracker.js"></script>
<script>
const startTime = Date.now();
const items = [
  {id:1, text:'Reduce 是「減少使用包裝」的意思。', cat:'5R'},
  {id:2, text:'Recycle 強調讓用過的材料變成新的東西。', cat:'5R'},
  {id:3, text:'天然澱粉塗在紙上，可以防油防水。', cat:'技術'},
  {id:4, text:'矽基材質讓水氣可以慢慢跑出來。', cat:'技術'},
  {id:5, text:'大麥克改用中間綁一條紙的「腰帶」設計。', cat:'結構'},
  {id:6, text:'新包裝用單手就能打開，方便食用。', cat:'結構'},
  {id:7, text:'這個專案讓麥當勞每年少用 86 噸塑膠。', cat:'數據'},
  {id:8, text:'整個專案花了將近 3 年才完成。', cat:'數據'}
];
const placedMap = {}; // id -> bucket category

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function render(){
  const pool = document.getElementById('pool');
  pool.innerHTML = '';
  shuffle(items).forEach(it => {
    if(placedMap[it.id]) return;
    const el = document.createElement('div');
    el.className = 'sent';
    el.draggable = true;
    el.dataset.id = it.id;
    el.textContent = it.text;
    el.ondragstart = e => {
      e.dataTransfer.setData('text/plain', it.id);
      el.classList.add('dragging');
    };
    el.ondragend = () => el.classList.remove('dragging');
    pool.appendChild(el);
  });

  document.querySelectorAll('.bucket').forEach(b => {
    const cat = b.dataset.cat;
    const itemsBox = b.querySelector('.bucket-items');
    itemsBox.innerHTML = '';
    Object.entries(placedMap).forEach(([id, c]) => {
      if(c !== cat) return;
      const item = items.find(x => x.id == id);
      const el = document.createElement('div');
      el.className = 'dropped';
      el.innerHTML = `<span>${item.text}</span>
        <span class="remove" onclick="removeItem(${id})">×</span>`;
      itemsBox.appendChild(el);
    });

    b.ondragover = e => { e.preventDefault(); b.classList.add('over'); };
    b.ondragleave = () => b.classList.remove('over');
    b.ondrop = e => {
      e.preventDefault();
      b.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      placedMap[id] = cat;
      updateCount();
      render();
    };
  });
}

function removeItem(id){
  delete placedMap[id];
  updateCount();
  render();
}

function updateCount(){
  const n = Object.keys(placedMap).length;
  document.getElementById('placed').textContent = n + ' / 8';
}

function checkAll(){
  if(Object.keys(placedMap).length < 8){
    alert('請把全部 8 個句子都放好。\nHãy đặt tất cả 8 câu vào ô.');
    return;
  }
  let correct = 0;
  document.querySelectorAll('.bucket').forEach(b => {
    const cat = b.dataset.cat;
    b.querySelectorAll('.dropped').forEach((el, idx) => {
      const id = parseInt(Object.entries(placedMap)
        .filter(([_, c]) => c === cat)[idx][0]);
      const item = items.find(x => x.id === id);
      if(item.cat === cat){ correct++; }
      else { el.classList.add('wrong'); }
    });
  });
  document.getElementById('correct').textContent = correct + ' / 8';
  document.getElementById('correct').style.color = correct === 8 ? '#2A9D8F' : '#E63946';
  const score = Math.round(correct/8*100);
  document.getElementById('final-score').textContent = score;
  document.getElementById('complete').classList.add('show');
  FPTracker.recordResult({
    gameId: '02_paragraph_match',
    gameName: '句子配段落',
    score, wrong: 8 - correct, total: 8,
    durationMs: Date.now() - startTime
  });
}

function reset(){
  for(let k in placedMap) delete placedMap[k];
  document.getElementById('correct').textContent = '—';
  document.getElementById('correct').style.color = '#2A9D8F';
  document.getElementById('complete').classList.remove('show');
  updateCount();
  render();
}

render();
document.getElementById('qr-img').src =
  'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='
  + encodeURIComponent(window.location.href);
FPTracker.renderIdentityBadge(document.getElementById('cloud-badge'));
</script>
</body>
</html>
