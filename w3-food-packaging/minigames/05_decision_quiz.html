<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 5 · 情境決策（寫作 brainstorm）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans TC','Be Vietnam Pro',-apple-system,sans-serif;
  background:#FFFBF0; color:#2D1A0F; min-height:100vh;
  padding:18px; line-height:1.6;
}
.wrap{max-width:760px; margin:0 auto;}
header{text-align:center; margin-bottom:14px;}
header h1{font-size:1.6rem; color:#E63946; margin-bottom:6px;}
header p{font-size:.95rem; color:#5A3D2E;}
.vn{ color:#DA251D; font-style:italic; }
.note{
  background:#FFF4D6; padding:12px 16px; border-radius:10px;
  border-left:4px solid #F4A300; font-size:.92rem;
  margin-bottom:14px; color:#5A3D2E;
}
.progress-bar{
  background:#fff; padding:12px 18px; border-radius:12px;
  margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.05);
  display:flex; justify-content:space-between; align-items:center;
  font-weight:700;
}
.scenario{
  background:#fff; padding:24px; border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
  margin-bottom:18px;
}
.s-tag{
  display:inline-block; padding:4px 12px; background:#E63946;
  color:#fff; font-family:monospace; font-size:.8rem;
  border-radius:14px; margin-bottom:10px;
}
.s-title{
  font-size:1.25rem; font-weight:700; color:#2D1A0F;
  margin-bottom:10px;
}
.s-body{
  background:#F8F0E0; padding:14px 16px; border-radius:10px;
  font-size:1rem; color:#2D1A0F; margin-bottom:18px;
  line-height:1.7;
}
.options{ display:grid; gap:12px; }
.opt{
  background:#fff; border:2px solid #E5D9C7; border-radius:12px;
  padding:14px 18px; cursor:pointer; font-size:1rem;
  text-align:left; transition:all .2s;
}
.opt:hover{ border-color:#F4A300; transform:translateY(-2px); }
.opt.chosen{ background:#FFF4D6; border-color:#E63946; }
.opt.recommended{ background:#E8F4F2; border-color:#2A9D8F; }
.opt .label{ font-weight:700; color:#5A3D2E; margin-bottom:4px;
  font-family:monospace;}
.opt .recommend-tag{
  display:inline-block; margin-left:8px; padding:2px 8px;
  background:#2A9D8F; color:#fff; font-size:.75rem;
  border-radius:8px; font-family:monospace;
}
.analysis{
  margin-top:14px; padding:16px; background:#E8F4F2;
  border-left:4px solid #2A9D8F; border-radius:10px;
  display:none;
}
.analysis.show{ display:block; }
.analysis h4{ color:#2A9D8F; margin-bottom:8px; font-size:1rem;}
.analysis p{ font-size:.92rem; color:#2D1A0F; }
.analysis .write-hint{
  margin-top:12px; padding-top:10px; border-top:1px dashed #2A9D8F;
}
.analysis .write-hint b{ color:#E63946; }
.controls{ text-align:center; margin-top:14px; }
.btn{
  display:inline-block; padding:12px 28px; background:#E63946;
  color:#fff; border:none; border-radius:24px; font-weight:700;
  cursor:pointer; font-size:1rem; margin:4px;
}
.btn.green{ background:#2A9D8F; }
.btn:hover{ opacity:.85; }
.complete{
  background:#fff; padding:24px; border-radius:14px;
  text-align:center; margin-top:18px; display:none;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.complete.show{ display:block; }
.complete h2{ color:#2A9D8F; margin-bottom:10px; }
.complete .write-prompt{
  margin-top:14px; padding:16px; background:#FFF4D6;
  border-radius:10px; text-align:left;
}
.qr-section{ text-align:center; margin-top:18px; }
.qr-section img{ width:120px; height:120px; padding:6px;
  background:#fff; border-radius:8px;}
.qr-section p{ font-size:.8rem; color:#8B6F5E; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 Game 5 · 情境決策</h1>
    <p>3 個情境題，幫你想清楚 Edcafe 作業要寫什麼。</p>
  </header>

  <div class="note">
    🎯 <b>沒有標準答案</b>。每個選擇都會帶你看到不同的寫作角度，可以記下你最有感的方向。
  </div>

  <div class="progress-bar">
    <span id="q-progress">1 / 3</span>
    <span id="picks-show">已選擇 0 個</span>
  </div>

  <div id="zone"></div>

  <div id="complete" class="complete">
    <h2>🎯 你的寫作方向已準備好！</h2>
    <p>把你剛剛選的 3 個方向組合起來，就是一篇好作文的骨架。</p>
    <div class="write-prompt">
      <h4 style="color:#E63946; margin-bottom:8px;">📝 寫作提示</h4>
      <p style="font-size:.95rem;" id="picks-summary"></p>
      <p style="margin-top:10px; font-size:.92rem; color:#5A3D2E;">
        💡 現在到 <b>Edcafe</b> 把你的想法寫成 200 字的短文吧！
      </p>
    </div>
    <button class="btn" onclick="reset()" style="margin-top:14px;">🔄 再試一次</button>
  </div>

  <div class="qr-section">
    <img id="qr-img" alt="QR">
    <p>掃描分享</p>
  </div>

  <div id="cloud-badge" style="text-align:center; margin-top:10px;
       font-family:monospace; font-size:.78rem; color:#8B6F5E;"></div>
</div>

<script src="firebase-config.js"></script>
<script src="supabase-config.js"></script>
<script src="tracker.js"></script>
<script>
const startTime = Date.now();
const scenarios = [
  {
    title:'你是越南胡志明市的咖啡店老闆，店裡每天賣出 200 杯外帶咖啡。',
    body:'最近台灣麥當勞減塑的新聞讓你心動，但是「無塑紙杯」的成本比塑膠淋膜紙杯<b>貴 25%</b>。你會怎麼做？',
    options:[
      {label:'A', text:'全部換成無塑紙杯，差價自己吸收。', angle:'品牌價值優先'},
      {label:'B', text:'多收顧客 3,000 越南盾的「環保費」。', angle:'成本分攤策略', recommended:true},
      {label:'C', text:'先換 30%，看顧客反應再決定。', angle:'分階段測試'}
    ],
    write_hints:{
      A:'可以寫品牌長期形象 > 短期利潤的觀點，用「不只…還…」句型。',
      B:'這是麥當勞策略的延伸 —— 讓消費者一起參與永續。寫作時可比較「成本」與「責任」。',
      C:'這是最務實的做法，可以用「先…再…」的時間順序句型寫。'
    }
  },
  {
    title:'你的好朋友說：「為了 86 噸塑膠，花 3 年研發，很不划算。」',
    body:'你要怎麼回應他？選擇一個你最想說的觀點。',
    options:[
      {label:'A', text:'86 噸 = 2.4 隻成年藍鯨的重量，並不少。', angle:'用具體比喻說服'},
      {label:'B', text:'重點不只是數字，而是建立「可以做到」的範例。', angle:'示範效應 / 系統影響', recommended:true},
      {label:'C', text:'3 年其實不長，因為涉及 13 個部門合作。', angle:'同理研發過程'}
    ],
    write_hints:{
      A:'寫作時用「相當於…」「等於…」這類比喻句型，讓讀者有感。',
      B:'從「個案」談到「系統」的論點層次比較高，建議在作文「轉」段用。',
      C:'適合在作文裡解釋為什麼產業改變需要時間，可用「因為…所以…」句型。'
    }
  },
  {
    title:'越南政府想推一個食品包裝法規，你被找去當顧問。',
    body:'你會建議優先做哪一個 R？',
    options:[
      {label:'A', text:'Replace（材質轉換）—— 強制速食業換成可分解材料。', angle:'技術替代路線', recommended:true},
      {label:'B', text:'Reduce（減量）—— 規定每杯咖啡限用一個杯蓋。', angle:'源頭減量路線'},
      {label:'C', text:'Recycle（強化回收）—— 補助廢紙回收業者。', angle:'下游處理路線'}
    ],
    write_hints:{
      A:'符合台灣麥當勞案例的方向，可在作文裡舉麥當勞為例子。',
      B:'論點：「最環保的包裝是沒有包裝」，可用「與其…不如…」句型。',
      C:'適合提及越南既有的回收基礎建設，用「目前…，可以…」句型。'
    }
  }
];

let cur = 0;
const picks = []; // {scenarioIdx, optionLabel}

function show(idx){
  if(idx >= scenarios.length){ finish(); return; }
  const s = scenarios[idx];
  document.getElementById('q-progress').textContent = (idx+1) + ' / 3';
  const zone = document.getElementById('zone');
  zone.innerHTML = `
    <div class="scenario">
      <span class="s-tag">情境 ${idx+1}</span>
      <div class="s-title">${s.title}</div>
      <div class="s-body">${s.body}</div>
      <div class="options">
        ${s.options.map((o, i) => `
          <button class="opt${o.recommended?' recommended':''}" data-idx="${i}">
            <div class="label">選項 ${o.label}${o.recommended?'<span class="recommend-tag">★ 教師推薦</span>':''}</div>
            <div>${o.text}</div>
          </button>
        `).join('')}
      </div>
      <div class="analysis" id="analysis"></div>
      <div class="controls" id="next-ctrl" style="display:none;">
        <button class="btn green" onclick="next()">下一題 →</button>
      </div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => choose(parseInt(btn.dataset.idx), btn);
  });
}

function choose(optIdx, btn){
  document.querySelectorAll('.opt').forEach(b => {
    b.classList.remove('chosen');
    b.style.pointerEvents = 'none';
  });
  btn.classList.add('chosen');
  const s = scenarios[cur];
  const opt = s.options[optIdx];
  picks.push({scenarioIdx:cur, label:opt.label, angle:opt.angle});
  document.getElementById('picks-show').textContent = '已選擇 ' + picks.length + ' 個';
  const a = document.getElementById('analysis');
  a.innerHTML = `
    <h4>💭 你選了：${opt.text}</h4>
    <p><b>切入角度：</b>${opt.angle}</p>
    <div class="write-hint">
      <p><b>📝 寫作鷹架：</b>${s.write_hints[opt.label]}</p>
    </div>
  `;
  a.classList.add('show');
  document.getElementById('next-ctrl').style.display = 'block';
}

function next(){
  cur++;
  show(cur);
}

function finish(){
  document.getElementById('zone').style.display = 'none';
  const summary = picks.map((p, i) =>
    `<b>情境 ${i+1}</b>（${scenarios[p.scenarioIdx].title.slice(0,18)}…）：你選了 <b style="color:#E63946;">${p.angle}</b>。`
  ).join('<br>');
  document.getElementById('picks-summary').innerHTML = summary;
  document.getElementById('complete').classList.add('show');
  FPTracker.recordResult({
    gameId: '05_decision_quiz',
    gameName: '情境決策',
    score: 100, wrong: 0, total: 3,
    durationMs: Date.now() - startTime,
    meta: { picks: picks.map(p => ({ scenario: p.scenarioIdx+1, label: p.label, angle: p.angle })) }
  });
}

function reset(){
  cur = 0; picks.length = 0;
  document.getElementById('picks-show').textContent = '已選擇 0 個';
  document.getElementById('zone').style.display = 'block';
  document.getElementById('complete').classList.remove('show');
  show(0);
}

show(0);
document.getElementById('qr-img').src =
  'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='
  + encodeURIComponent(window.location.href);
FPTracker.renderIdentityBadge(document.getElementById('cloud-badge'));
</script>
</body>
</html>
